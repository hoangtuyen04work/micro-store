server:
  port: 8080
  servlet:
    context-path: /auth

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://db:3306/test?useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:12345678}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
        hibernate:
          dialect: org.hibernate.dialect.MySQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}  # Update if Kafka is added in Docker Compose
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.trusted.packages: com.shop.event,com.shop.event

jwt:
  signerKey: "${JWT_SIGNER_KEY:8d01f3c2a52fa0af4a3619ab447510da38909d2e9a7386de1005ebd280d4b8f2a24ef2bb6c99a28f5386c07c01da3ff3c5f65490077d209a25a50485b3543020}"

app:
  service:
    profile:
      url: "http://localhost:8081/profile"
      name: "profile-service"
    notification:
      url: "http://localhost:8082/notify"
      name: "notification-service"
